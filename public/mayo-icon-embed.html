<script>
const SX=22.046, SY=4.519, AX=[0.169,-0.986], M0=[286,70], R=620;
const $=s=>document.querySelector(s), NS='http://www.w3.org/2000/svg';
const ridges=$('#ridges'), capG=$('#capG'), bottle=$('#bottle'), globsEl=$('#globs'), mass=$('#mass');
let st={mode:'closed',clicks:0,phase:0,phaseT:0,lift:0,liftT:0,fly:0,flyDir:0,bt:0,spawned:0};
let globs=[];
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function massPath(r,w){
  if(r<=0.5)return '';
  const n=72;let d='';
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;
    const rr=r*(1+0.05*Math.sin(a*5+w)+0.03*Math.sin(a*9-w*1.3));
    d+=(i?'L':'M')+(M0[0]+rr*Math.cos(a)).toFixed(1)+' '+(M0[1]+rr*Math.sin(a)).toFixed(1);
  }
  return d+'Z';
}
function spawnFast(){
  const dir=Math.random()<.5?-1:1, e=(-10+Math.random()*55)*Math.PI/180, sp=8+Math.random()*5;
  const el=document.createElementNS(NS,'ellipse');
  el.setAttribute('fill','#FFFDF2');el.setAttribute('stroke','#E9D78F');el.setAttribute('stroke-width','3');
  globsEl.appendChild(el);
  globs.push({x:M0[0],y:M0[1],vx:dir*Math.cos(e)*sp,vy:-Math.sin(e)*sp,g:0.3,t:0,el});
}
function burst(){
  st.mode='bursting';st.bt=0;st.spawned=0;st.reseted=false;
  bottle.animate([{transform:'scale(1,1)'},{transform:'scale(1.09,0.86)',offset:.25},{transform:'scale(.98,1.04)',offset:.6},{transform:'scale(1,1)'}],{duration:420,easing:'ease-out'});
}
function clearGlobs(){globs.forEach(o=>o.el.remove());globs=[]}

$('#icon').addEventListener('click',()=>{
  window.parent.postMessage({type:'mayo-brand-mark-activated'},'*');
  if(st.flyDir!==0||st.mode==='bursting')return;
  if(st.mode==='closed'){
    st.clicks++;
    if(st.clicks<4){st.phaseT+=1;st.liftT+=10}
    else{st.phaseT+=1;st.flyDir=1;st.mode='opening'}
  }else if(st.mode==='open'){
    burst();
  }
});

let last=performance.now();
function frame(now){
  const dt=Math.min(2,(now-last)/16.667);last=now;
  const k=1-Math.pow(0.78,dt);
  st.phase+=(st.phaseT-st.phase)*k;st.lift+=(st.liftT-st.lift)*k;
  if(st.flyDir!==0){
    st.fly+=st.flyDir*dt/(st.flyDir>0?38:44);
    if(st.fly>=1){st.fly=1;st.flyDir=0;st.mode='open';capG.style.display='none'}
    else if(st.fly<=0){st.fly=0;st.flyDir=0;st.mode='closed'}
  }
  if(capG.style.display!=='none'){
    const p=st.fly, e=p*p*(3-2*p), ph=(((st.phase+p*3)%4)+4)%4;
    ridges.setAttribute('transform',`translate(${(ph*SX).toFixed(2)} ${(ph*SY).toFixed(2)})`);
    capG.setAttribute('transform',`translate(${(AX[0]*st.lift+170*e).toFixed(2)} ${(AX[1]*st.lift-190*e).toFixed(2)}) rotate(${(e*240).toFixed(1)} 286 100)`);
  }
  if(st.mode==='bursting'){
    st.bt+=dt*16.667;const t=st.bt;
    while(st.spawned<14&&t>=st.spawned*15){spawnFast();st.spawned++}
    let r=R,op=1;
    if(t<700)r=R*Math.pow(t/700,2.2);
    else{
      if(!st.reseted){
        st.reseted=true;clearGlobs();
        Object.assign(st,{clicks:0,phase:0,phaseT:0,lift:0,liftT:0,fly:0,flyDir:0});
        capG.style.display='';
      }
      if(t>=2700)op=Math.max(0,1-(t-2700)/700);
    }
    if(t>=3400){r=0;op=1;st.mode='closed'}
    mass.style.opacity=op;
    mass.setAttribute('d',massPath(r,t*0.012));
  }
  for(let i=globs.length-1;i>=0;i--){
    const o=globs[i];
    o.t+=dt;o.x+=o.vx*dt;o.vy+=o.g*dt;o.y+=o.vy*dt;
    if(o.t>100||o.y>620){o.el.remove();globs.splice(i,1);continue}
    const sp=Math.hypot(o.vx,o.vy), ang=Math.atan2(o.vy,o.vx)*180/Math.PI-90;
    o.el.setAttribute('rx','9');o.el.setAttribute('ry',Math.min(20,9+sp*0.9).toFixed(1));
    o.el.setAttribute('transform',`translate(${o.x.toFixed(1)} ${o.y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
